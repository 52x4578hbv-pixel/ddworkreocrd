name: Deploy frontend (Azure Static Web Apps)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & deploy ddworkrecord-console to Azure Static Web Apps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          token='${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}'
          if [ -z "$token" ]; then
            echo "ERROR: Missing repo secret AZURE_STATIC_WEB_APPS_API_TOKEN"
            exit 1
          fi

      - name: Install & Build frontend (ddworkrecord-console)
        working-directory: daily-work-tracker-ios/ddworkrecord-console
        run: |
          npm ci
          npm run build

      - name: Build & Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          INPUT_ACTION: upload
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'

          # Frontend app location inside this repo
          app_location: daily-work-tracker-ios/ddworkrecord-console

          # Vite output dir
          output_location: dist

          # Use the repo's existing SWA config (hash routing + CSP)
          config_file_location: daily-work-tracker-ios/ddworkrecord-console
