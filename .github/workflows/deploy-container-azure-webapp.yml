name: Build and deploy a container to an Azure Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Resource group containing the API Web App
  AZURE_RESOURCE_GROUP: DailyWorkTracker-RG

  # Azure Web App name for the API container (from Azure portal)
  AZURE_WEBAPP_NAME: ddworkapi-1778615679

  # CHANGE THIS if your Dockerfile is elsewhere
  IMAGE_BUILD_CONTEXT: ./daily-work-tracker-ios/DW
  DOCKERFILE: ./daily-work-tracker-ios/DW/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      app_port: ${{ steps.build_and_push.outputs.app_port }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        shell: bash
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push image
        id: build_and_push
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="${GITHUB_WORKSPACE}"
          IMAGE="ghcr.io/${{ env.REPO }}:${{ github.sha }}"

          LOG_BUILD="${GITHUB_WORKSPACE:-/tmp}/docker-build.log"
          LOG_PUSH="${GITHUB_WORKSPACE:-/tmp}/docker-push.log"
          : > "$LOG_BUILD"
          : > "$LOG_PUSH"
          echo "=== Build step started at $(date -u +'%Y-%m-%dT%H:%M:%SZ') ===" >> "$LOG_BUILD"
          echo "IMAGE=$IMAGE" >> "$LOG_BUILD"

          # If anything fails before we reach docker build, we still want a useful log file.
          set -E
          trap "echo \"!! failure at line \$LINENO (exit \$?) cmd=\$BASH_COMMAND\" >> \"\$LOG_BUILD\"" ERR

          echo "== Diagnostics: where are we and what is checked out? =="
          pwd
          echo "--- repo root ls ---"
          ls -la
          echo "--- daily-work-tracker-ios ls ---"
          ls -la "$SOURCE_DIR/daily-work-tracker-ios" || true

          DW_DOCKERFILE="$SOURCE_DIR/daily-work-tracker-ios/DW/Dockerfile"
          CONSOLE_DOCKERFILE="$SOURCE_DIR/daily-work-tracker-ios/ddworkrecord-console/Dockerfile"

          PATCH_DW="false"
          CONTEXT_SUBDIR=""
          APP_PORT="4173"
          if [ -f "$DW_DOCKERFILE" ]; then
            CONTEXT_SUBDIR="daily-work-tracker-ios/DW"
            PATCH_DW="true"
            APP_PORT="3000"
            echo "Detected DW Dockerfile ✅"
          elif [ -f "$CONSOLE_DOCKERFILE" ]; then
            CONTEXT_SUBDIR="daily-work-tracker-ios/ddworkrecord-console"
            echo "DW Dockerfile not present; falling back to console Dockerfile ✅"
          else
            echo "::error title=No Dockerfile found::Neither DW/Dockerfile nor ddworkrecord-console/Dockerfile exists in extracted source"
            ls -la "$SOURCE_DIR/daily-work-tracker-ios" || true
            exit 1
          fi

          echo "app_port=$APP_PORT" >> "$GITHUB_OUTPUT"

          echo "--- using CONTEXT_SUBDIR=$CONTEXT_SUBDIR =="
          ls -la "$SOURCE_DIR/$CONTEXT_SUBDIR" || true
          test -f "$SOURCE_DIR/$CONTEXT_SUBDIR/Dockerfile"
          echo "Dockerfile exists ✅"

          echo "== Building Docker image from /tmp context (avoid git tooling) =="

          rm -rf /tmp/dw-build-context
          mkdir -p /tmp/dw-build-context
          rsync -a --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude npm-debug.log \
            --exclude .DS_Store \
            --exclude .AppleDouble \
            --exclude .LSOverride \
            --exclude .Spotlight-V100 \
            --exclude .Trashes \
            "$SOURCE_DIR/$CONTEXT_SUBDIR/" /tmp/dw-build-context/ \
            || { echo "::error title=rsync failed::"; ls -la /tmp || true; ls -la /tmp/dw-build-context || true; exit 1; }

          if [ "${PATCH_DW}" = "true" ]; then
            echo "== Applying CI patches for DW server/businessRoutes =="
            test -f "$SOURCE_DIR/.github/patches/dw_server.ts"
            test -f "$SOURCE_DIR/.github/patches/dw_businessRoutes.ts"
            cp -f "$SOURCE_DIR/.github/patches/dw_server.ts" /tmp/dw-build-context/DW/server.ts
            cp -f "$SOURCE_DIR/.github/patches/dw_businessRoutes.ts" /tmp/dw-build-context/DW/businessRoutes.ts
            echo "== Patched DW server/businessRoutes files =="
            ls -la /tmp/dw-build-context/DW/server.ts /tmp/dw-build-context/DW/businessRoutes.ts || true
            echo "== DEBUG head(DW/server.ts) =="
            head -n 20 /tmp/dw-build-context/DW/server.ts || true
            echo "== DEBUG head(DW/businessRoutes.ts) =="
            head -n 20 /tmp/dw-build-context/DW/businessRoutes.ts || true
          fi

          echo "== Build context contents (sanity check) =="
          ls -la /tmp/dw-build-context || true
          if [ ! -s /tmp/dw-build-context/Dockerfile ]; then
            echo "::error title=Missing/empty Dockerfile in build context::/tmp/dw-build-context/Dockerfile is missing or empty"
            exit 1
          fi

          if [ "${PATCH_DW}" = "true" ]; then
            echo "== Patching DW tsconfig.json: set compilerOptions.types=['node'] =="
            if ! grep -q '"types"' /tmp/dw-build-context/tsconfig.json 2>/dev/null; then
              # Insert `types` right after the `rootDir` line (robust, avoids complex quoting).
              sed -i '/"rootDir": "\.\/",/a\    "types": ["node"],' /tmp/dw-build-context/tsconfig.json
            fi

            echo "== Patching DW Dockerfile: remove bogus @types/* 2 directories =="
            # Docker install may create empty dirs named like: node_modules/@types/express 2
            # These trigger TS2688 when tsc scans all @types folders.
            cp /tmp/dw-build-context/Dockerfile /tmp/dw-build-context/Dockerfile.patched || { echo "::error title=cp Dockerfile failed::"; ls -la /tmp/dw-build-context || true; exit 1; }
            sed -i "/^RUN npm install\$/a RUN find node_modules\/@types -maxdepth 1 -type d -name \"* 2\" -exec rm -rf {} + || true" /tmp/dw-build-context/Dockerfile.patched || { echo "::error title=sed Dockerfile patch failed::"; ls -la /tmp/dw-build-context || true; head -n 30 /tmp/dw-build-context/Dockerfile.patched || true; exit 1; }
            mv /tmp/dw-build-context/Dockerfile.patched /tmp/dw-build-context/Dockerfile || { echo "::error title=mv patched Dockerfile failed::"; ls -la /tmp/dw-build-context || true; exit 1; }
          else
            echo "== Skipping DW patching (using console Dockerfile build context) =="
          fi

          echo "== Patched/Dockerfile sanity =="
          wc -c /tmp/dw-build-context/Dockerfile || true
          head -n 30 /tmp/dw-build-context/Dockerfile || true

          DOCKERFILE_BYTES="$(wc -c /tmp/dw-build-context/Dockerfile 2>/dev/null | awk '{print $1}' || true)"
          echo "::notice title=Patched Dockerfile bytes::${DOCKERFILE_BYTES:-unknown}"
          if [ -z "${DOCKERFILE_BYTES}" ] || [ "${DOCKERFILE_BYTES}" = "0" ]; then
            echo "::error title=Patched Dockerfile empty::/tmp/dw-build-context/Dockerfile is empty or missing"
          fi

          : > "${GITHUB_WORKSPACE:-/tmp}/docker-build.log"
          echo "== Patched Dockerfile bytes: ${DOCKERFILE_BYTES:-unknown} ==" >> "${GITHUB_WORKSPACE:-/tmp}/docker-build.log"
          set -o pipefail
          set +e
          docker build --progress=plain \
            --pull \
            --no-cache \
            --tag "$IMAGE" \
            --file /tmp/dw-build-context/Dockerfile \
            /tmp/dw-build-context 2>&1 | tee "${GITHUB_WORKSPACE:-/tmp}/docker-build.log"
          build_status="${PIPESTATUS[0]:-1}"
          set -e
          echo "Docker build status: $build_status"
          echo "== docker-build.log bytes =="
          wc -c "${GITHUB_WORKSPACE:-/tmp}/docker-build.log" || true

          if [ "${build_status}" != "0" ]; then
            echo "== Docker build failed — tail log =="
            tail -n 200 "${GITHUB_WORKSPACE:-/tmp}/docker-build.log" || true

            tail_msg="$(tail -n 40 "${GITHUB_WORKSPACE:-/tmp}/docker-build.log" 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-800 || true)"
            echo "::error title=Docker build failed::${tail_msg}"

            exit $build_status
          fi

          echo "== Pushing Docker image =="
          : > "${GITHUB_WORKSPACE:-/tmp}/docker-push.log"
          set -o pipefail
          set +e
          docker push "$IMAGE" 2>&1 | tee "${GITHUB_WORKSPACE:-/tmp}/docker-push.log"
          push_status="${PIPESTATUS[0]:-1}"
          set -e
          echo "== docker-push.log bytes =="
          wc -c "${GITHUB_WORKSPACE:-/tmp}/docker-push.log" || true

          if [ "${push_status}" != "0" ]; then
            echo "== Docker push failed — tail log =="
            tail -n 200 "${GITHUB_WORKSPACE:-/tmp}/docker-push.log" || true

            tail_msg="$(tail -n 40 "${GITHUB_WORKSPACE:-/tmp}/docker-push.log" 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-800 || true)"
            echo "::error title=Docker push failed::${tail_msg}"

            exit $push_status
          fi

      - name: Copy docker logs to workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          # docker build/push logs are already written directly to $GITHUB_WORKSPACE above.
          # Keep this step to ensure files exist for artifact upload.
          touch "$GITHUB_WORKSPACE/docker-build.log" "$GITHUB_WORKSPACE/docker-push.log"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" | sed -n '1,60p' || true
          echo "== docker-build.log stats =="
          ls -la "$GITHUB_WORKSPACE/docker-build.log" || true
          echo "== docker-build.log head =="
          head -n 40 "$GITHUB_WORKSPACE/docker-build.log" || true

          echo "== docker-build.log tail (annotation) =="
          docker_build_tail="$(tail -n 80 "$GITHUB_WORKSPACE/docker-build.log" 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-800 || true)"
          echo "::notice title=docker-build.log tail::${docker_build_tail}"

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/docker-build.log
            ${{ github.workspace }}/docker-push.log

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          creds='${{ secrets.AZURE_CREDENTIALS }}'
          if [ -z "$creds" ]; then
            echo "ERROR: Missing repo secret AZURE_CREDENTIALS (Azure service principal JSON)"
            exit 1
          fi

          if [ -z "${{ env.AZURE_WEBAPP_NAME }}" ] || [ "${{ env.AZURE_WEBAPP_NAME }}" = "your-app-name" ]; then
            echo "ERROR: env.AZURE_WEBAPP_NAME is not set correctly in workflow"
            exit 1
          fi

      - name: Compute image name (lowercase)
        shell: bash
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set container image on Web App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ env.REPO }}:${{ github.sha }}"

            echo "Setting container image to: $IMAGE"

            az webapp config container set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --docker-custom-image-name "$IMAGE" \
              --docker-registry-server-url "https://ghcr.io" \
              --docker-registry-server-user "${{ github.actor }}" \
              --docker-registry-server-password "${{ secrets.GITHUB_TOKEN }}"

            # Ensure container listens on the port the Azure Web App expects.
            az webapp config appsettings set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --settings PORT="${{ needs.build-and-push.outputs.app_port }}" WEBSITES_PORT="${{ needs.build-and-push.outputs.app_port }}"

            az webapp restart \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}"
