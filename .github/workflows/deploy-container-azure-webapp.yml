name: Build and deploy a container to an Azure Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Resource group containing the API Web App
  AZURE_RESOURCE_GROUP: DailyWorkTracker-RG

  # Azure Web App name for the API container (from Azure portal)
  AZURE_WEBAPP_NAME: ddworkapi-1778615679

  # CHANGE THIS if your Dockerfile is elsewhere
  IMAGE_BUILD_CONTEXT: ./daily-work-tracker-ios/DW
  DOCKERFILE: ./daily-work-tracker-ios/DW/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ env.REPO }}:${{ github.sha }}"

          echo "== Checking build context and Dockerfile paths =="
          ls -la ./daily-work-tracker-ios/DW
          test -f ./daily-work-tracker-ios/DW/Dockerfile
          echo "Dockerfile exists ✅"

          echo "== Verifying git repo state on runner =="
          test -d .git
          git rev-parse --short HEAD
          echo "Git repo exists ✅"

          echo "== Docker buildx info =="
          docker buildx version || true
          docker buildx inspect --bootstrap || true

          echo "== Running docker buildx build (capturing logs) =="
          export BUILDX_NO_DEFAULT_ATTESTATIONS=1
          set +e
          TMP_LOG="$(mktemp)"

          echo "== Creating .git shim inside build context (for buildx git metadata) =="
          if [ ! -e ./daily-work-tracker-ios/DW/.git ]; then
            echo "gitdir: ../../.git" > ./daily-work-tracker-ios/DW/.git
          fi

          docker buildx build \
            --push \
            --provenance=false \
            --progress=plain \
            --tag "$IMAGE" \
            --file ./daily-work-tracker-ios/DW/Dockerfile \
            ./daily-work-tracker-ios/DW 2>&1 | tee "$TMP_LOG"
          BUILD_EXIT="${PIPESTATUS[0]}"
          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "docker buildx failed (exit=$BUILD_EXIT). Capturing tail for annotation..."
            TAIL="$(tail -n 50 "$TMP_LOG" | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error::docker buildx failed (exit=$BUILD_EXIT). Tail: $TAIL"
            exit "$BUILD_EXIT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          creds='${{ secrets.AZURE_CREDENTIALS }}'
          if [ -z "$creds" ]; then
            echo "ERROR: Missing repo secret AZURE_CREDENTIALS (Azure service principal JSON)"
            exit 1
          fi

          if [ -z "${{ env.AZURE_WEBAPP_NAME }}" ] || [ "${{ env.AZURE_WEBAPP_NAME }}" = "your-app-name" ]; then
            echo "ERROR: env.AZURE_WEBAPP_NAME is not set correctly in workflow"
            exit 1
          fi

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set container image on Web App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ env.REPO }}:${{ github.sha }}"

            echo "Setting container image to: $IMAGE"

            az webapp config container set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --docker-custom-image-name "$IMAGE"

            az webapp restart \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}"
